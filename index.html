<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本語語彙マッチ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/styles.css?v=57">
</head>
<body>
  <main class="app">
    <section class="screen active" id="homeScreen">
      <header class="topbar">
        <h1>日本語語彙マッチ</h1>
      </header>

      <section class="level-select" aria-label="选择开始等级">
        <h2>请选择你要开始的等级</h2>
        <div class="level-buttons">
          <button class="level-button" type="button" data-level="CHALLENGE">挑战</button>
          <button class="level-button" type="button" data-level="N1">N1</button>
          <button class="level-button" type="button" data-level="N2">N2</button>
          <button class="level-button" type="button" data-level="N3">N3</button>
          <button class="level-button" type="button" data-level="N4">N4</button>
          <button class="level-button" type="button" data-level="N5">N5</button>
        </div>
      </section>
    </section>

    <section class="screen" id="mapScreen">
      <header class="topbar">
        <h1>地图</h1>
      </header>

      <section class="map-path" id="stageMap" aria-label="N5至挑战关卡地图"></section>
    </section>

    <section class="screen" id="gameScreen">
      <header class="topbar">
        <button class="icon-button" id="backToMapButton" type="button">地图</button>
        <h1 id="gameTitle">N5 第1关</h1>
        <div class="score-chip"><span id="matchedCount">0</span>/<span id="stageWordCount">20</span></div>
      </header>

      <section class="hud" aria-label="倒计时">
        <div class="progress-shell">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="timer" id="timer">100s</div>
      </section>

      <section class="board" aria-label="单词配对棋盘">
        <div class="column" id="jpColumn" aria-label="日语单词"></div>
        <div class="column" id="cnColumn" aria-label="中文意思"></div>
      </section>
    </section>

    <section class="screen" id="profileScreen">
      <header class="topbar">
        <h1>我的</h1>
      </header>
      <section class="journey-progress" aria-label="总通关进度">
        <div class="journey-heading">
          <span>进度</span>
          <strong><span id="journeyCleared">0</span> / <span id="journeyTotal">308</span></strong>
        </div>
        <div class="journey-track-wrap">
          <div class="journey-marker journey-orange" id="journeyMarker" aria-hidden="true">
            <span class="orange-leaf"></span>
          </div>
          <div class="journey-track">
            <div class="journey-fill" id="journeyFill"></div>
          </div>
        </div>
        <div class="journey-levels" id="journeyLevels" aria-hidden="true"></div>
      </section>
      <section class="profile-summary" aria-label="通关统计">
        <div class="summary-group">
          <h2>今日</h2>
          <div class="summary-card">
            <div><span>通关数</span><strong id="todayCleared">0</strong></div>
            <div><span>星星数</span><strong id="todayStars">0</strong></div>
          </div>
        </div>
        <div class="summary-group">
          <h2>累计</h2>
          <div class="summary-card">
            <div><span>通关数</span><strong id="totalCleared">0</strong></div>
            <div><span>星星数</span><strong id="totalStars">0</strong></div>
          </div>
        </div>
      </section>
      <section class="hidden-progress" aria-label="挑战关卡进度">
        <div class="journey-heading">
          <span>挑战关卡</span>
          <strong><span id="hiddenCleared">0</span> / <span id="hiddenTotal">30</span></strong>
        </div>
        <div class="hidden-track-wrap">
          <div class="hidden-marker journey-orange" id="hiddenMarker" aria-hidden="true">
            <span class="orange-leaf"></span>
          </div>
          <div class="hidden-track">
            <div class="hidden-fill" id="hiddenFill"></div>
          </div>
        </div>
      </section>
    </section>

    <section class="screen" id="wordbookScreen">
      <header class="topbar">
        <h1>单词本</h1>
      </header>

      <section class="wordbook-panel" aria-label="收藏单词">
        <div class="wordbook-heading">
          <div>
            <h2>收藏词</h2>
            <span><span id="favoriteCount">0</span> 个</span>
          </div>
          <button class="primary-button compact-button" id="startFlashButton" type="button">开始闪卡复习</button>
        </div>
        <div class="wordbook-list" id="wordbookList"></div>
      </section>
    </section>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="底部导航">
    <button class="nav-button active" id="homeNavButton" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 11 9-8 9 8"></path>
        <path d="M5 10v10h14V10"></path>
        <path d="M9 20v-6h6v6"></path>
      </svg>
      主页
    </button>
    <button class="nav-button" id="mapNavButton" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6a12 12 0 0 1 5-2l6 16a12 12 0 0 0-5 2Z"></path>
        <path d="M9 4a12 12 0 0 1 5 2l6-2v16l-6 2a12 12 0 0 0-5-2"></path>
      </svg>
      地图
    </button>
    <button class="nav-button" id="wordbookNavButton" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"></path>
        <path d="m12 7 1.2 2.4 2.6.4-1.9 1.8.4 2.6-2.3-1.2-2.3 1.2.4-2.6-1.9-1.8 2.6-.4Z"></path>
      </svg>
      单词本
    </button>
    <button class="nav-button" id="profileNavButton" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21a8 8 0 0 1 16 0"></path>
      </svg>
      我
    </button>
  </nav>

  <section class="modal-screen" id="resultScreen" aria-live="polite">
    <div class="result-card">
      <div class="result-hero">
        <div class="mascot" aria-hidden="true">✓</div>
        <div class="result-stars" id="stars"></div>
        <h2 id="resultTitle">完成！</h2>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <strong id="accuracy">100%</strong>
          <span>正确率</span>
        </div>
        <div class="stat-card">
          <strong id="finishTime">0s</strong>
          <span>完成时间</span>
        </div>
        <div class="stat-card">
          <strong id="finalScore">0/20</strong>
          <span>完成词数</span>
        </div>
      </div>
      <div class="result-actions">
        <button class="primary-button" id="againButton" type="button">再来一次</button>
        <button class="primary-button" id="nextButton" type="button">下一关</button>
        <button class="secondary-button" id="resultMapButton" type="button">返回地图</button>
      </div>
    </div>
  </section>

  <section class="modal-screen flash-screen" id="flashScreen" aria-live="polite">
    <div class="flash-panel">
      <div class="flash-topline">
        <span id="flashProgress">1 / 1</span>
        <button class="secondary-button compact-button" id="exitFlashButton" type="button" aria-label="退出闪卡">×</button>
      </div>
      <button class="flash-card" id="flashCard" type="button" aria-label="闪卡，点击翻面">
        <span class="flash-label" id="flashLabel">日语</span>
        <strong id="flashMain">単語</strong>
        <span id="flashSub">かな</span>
      </button>
      <div class="flash-actions">
        <button class="secondary-button" id="prevFlashButton" type="button">上一张</button>
        <button class="primary-button" id="nextFlashButton" type="button">下一张</button>
      </div>
    </div>
  </section>

  <script type="module" src="./js/app.js?v=59"></script>
</body>
</html>
